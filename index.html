<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Suma</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      text-align: center;
    }
    button {
      width: 88%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .resultado {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🧮 Calculadora</h2>
    <input type="number" id="num1" placeholder="Ingresa número 1">
    <input type="number" id="num2" placeholder="Ingresa número 2">
    <button onclick="sumar()">Calcular Suma</button>
    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    function sumar() {
      const n1 = parseFloat(document.getElementById('num1').value) || 0;
      const n2 = parseFloat(document.getElementById('num2').value) || 0;
      const suma = n1 + n2;
      document.getElementById('resultado').innerText = `Resultado: ${suma}`;
    }
  </script>

</body>
</html>
