<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Suma</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f6f9; }
    .card { background: #ffffff; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; width: 100%; max-width: 360px; }
    .card h1 { font-size: 1.5rem; color: #1e293b; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .input-group { margin-bottom: 1rem; }
    input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; text-align: center; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #2563eb; }
    button { width: 100%; padding: 0.75rem; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1d4ed8; }
    .result { margin-top: 1.5rem; font-size: 1.25rem; font-weight: bold; color: #0f172a; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🧮 Calculadora</h1>
    
    <div class="input-group">
      <input type="number" id="num1" placeholder="Número 1" value="16">
    </div>
    <div class="input-group">
      <input type="number" id="num2" placeholder="Número 2" value="16">
    </div>

    <button onclick="calcularSuma()">Calcular Suma</button>

    <div class="result" id="resultado">Resultado: 32</div>
  </div>

  <script>
    function calcularSuma() {
      const n1 = parseFloat(document.getElementById('num1').value) || 0;
      const n2 = parseFloat(document.getElementById('num2').value) || 0;
      document.getElementById('resultado').innerText = `Resultado: ${n1 + n2}`;
    }
  </script>

</body>
</html>
